<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120b24" />
    <title>Karaoke · DJ</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="dj-page">
    <header class="topbar">
      <span class="logo-sm">🎤 <span id="dj-name">DJ</span></span>
      <span class="topbar-right">
        <span id="tip-count" class="tip-count" title="Tips tonight" hidden></span>
        <a class="link" href="/dj-signup.html">Profile</a>
        <a class="link" href="/auth/logout">Log out</a>
      </span>
    </header>

    <main class="dj-main">
      <section class="card now-card">
        <h2 class="card-title">Now singing</h2>
        <div id="now" class="now"></div>
        <div class="button-row">
          <button id="next-btn" class="btn btn-primary">⏭ Next singer</button>
          <button id="open-player" class="btn btn-ghost" disabled>📺 Open player</button>
        </div>
      </section>

      <section class="card queue-card">
        <div class="queue-head">
          <h2 class="card-title">Tonight's line <span id="queue-count" class="muted"></span></h2>
          <span id="night" class="muted small"></span>
        </div>
        <ol id="queue" class="queue"></ol>
      </section>

      <section class="card tips-card">
        <h2 class="card-title">💲 Tips tonight</h2>
        <ul id="tips" class="tips"></ul>
      </section>
    </main>

    <div id="player-modal" class="player-modal" hidden role="dialog" aria-modal="true" aria-label="Karaoke player">
      <div class="player-frame">
        <div id="player"></div>
        <div id="player-external" class="player-external" hidden></div>
        <div class="overlay overlay-now" id="overlay-now"></div>
        <div class="overlay overlay-next">
          <div class="overlay-title">Up next</div>
          <ol id="overlay-next"></ol>
        </div>
        <div id="overlay-tips" class="overlay-tips" aria-live="polite"></div>
      </div>
      <div class="player-controls">
        <button id="player-next" class="btn btn-primary">⏭ Next singer</button>
        <button id="player-fullscreen" class="btn btn-ghost">⛶ Fullscreen</button>
        <button id="player-close" class="btn btn-ghost">✕ Close</button>
      </div>
    </div>

    <script type="module" src="/js/dj.js"></script>
  </body>
</html>
