<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120b24" />
    <title>Karaoke · Singer sign up</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <span class="logo-sm">🎤 Karaoke</span>
      <a class="link" href="/auth/logout">Log out</a>
    </header>
    <main class="narrow">
      <h1 id="heading">Set up your singer profile</h1>
      <p class="muted">DJs will call you up by this name.</p>

      <form id="singer-form" class="card form" novalidate>
        <label class="label" for="name">Stage name</label>
        <input id="name" class="input" name="name" maxlength="100" required autocomplete="nickname" />

        <label class="label" for="email">Email</label>
        <input id="email" class="input" name="email" type="email" readonly />

        <p id="form-error" class="banner banner-error" hidden></p>
        <button id="submit" class="btn btn-primary btn-block" type="submit">Save and start singing</button>
      </form>
    </main>
    <script type="module" src="/js/singer-signup.js"></script>
  </body>
</html>
